[package]
name = "guitar-chordbook"
description = "A terminal app and website for building and browsing a catalog of guitar chord diagrams, with SVG and PDF export"
repository = "https://github.com/zytyz/guitar-chordbook"
license = "MIT"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "guitar-chordbook"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
# The terminal app. The library itself does not need a terminal, so the web
# build turns this off.
tui = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.29.0", optional = true }
pdf-writer = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Chord diagrams are lines, circles and text: no raster images or filters.
svg2pdf = { version = "0.13.0", default-features = false, features = ["text"] }

[workspace]
members = [".", "web"]

# Release build for the website: smaller download, same behaviour.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
