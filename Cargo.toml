[package]
name = "guitar-chordbook"
description = "A terminal app for building and browsing a catalog of guitar chord diagrams, with SVG and PDF export"
repository = "https://github.com/zytyz/guitar-chordbook"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
pdf-writer = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svg2pdf = "0.13.0"
