[package]
name = "chordbook-web"
description = "WebAssembly bindings for guitar-chordbook, used by the website"
repository = "https://github.com/zytyz/guitar-chordbook"
license = "MIT"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
guitar-chordbook = { path = "..", default-features = false }
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
# Must match the wasm-bindgen CLI version exactly; scripts/build-web.sh checks this.
wasm-bindgen = "=0.2.100"
